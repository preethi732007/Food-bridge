<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Donate Food - FoodBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006a40",
                        "primary-container": "#268456",
                        "on-primary": "#ffffff",
                        "surface": "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "on-surface-variant": "#3f4941",
                        "outline-variant": "#bec9bf",
                        "surface-container-low": "#f5f3f3",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae8e7"
                    },
                    "borderRadius": { "lg": "0.5rem", "xl": "0.75rem" }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
</style>
</head>
<body class="bg-background dark:bg-[#121212] text-on-background dark:text-[#f2f0f0] antialiased flex flex-col min-h-screen pt-16 transition-colors duration-200">

<!-- TopNavBar -->
<nav class="fixed top-0 left-0 w-full z-50 px-4 md:px-6 max-w-[1280px] mx-auto shadow-sm bg-surface dark:bg-[#1a1a1a]">
    <div class="w-full h-16 flex items-center justify-between">
        <a class="text-2xl font-bold text-primary" href="Homepage.html">FoodBridge</a>
        <div class="hidden md:flex space-x-6 items-center">
            <a class="text-on-surface-variant dark:text-gray-300 hover:text-primary transition-colors" href="Homepage.html">Home</a>
            <a class="text-on-surface-variant dark:text-gray-300 hover:text-primary transition-colors" href="donee.html">How It Works</a>
            <a class="text-on-surface-variant dark:text-gray-300 hover:text-primary transition-colors" href="about.html">About</a>
            <a class="text-on-surface-variant dark:text-gray-300 hover:text-primary transition-colors" href="Contact.html">Contact</a>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Dark Mode Toggle -->
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-surface-container dark:bg-gray-800 hover:bg-surface-container-high text-on-surface dark:text-white flex items-center justify-center" title="Toggle Dark Mode">
                <span class="material-symbols-outlined text-sm" id="theme-icon">dark_mode</span>
            </button>
            <!-- Auth Buttons -->
            <div id="nav-auth-buttons" class="flex items-center gap-3">
                <a class="bg-primary text-on-primary rounded-lg px-4 py-2 text-sm font-semibold" href="login.html">Log In / Register</a>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="flex-grow flex flex-col items-center w-full px-4 md:px-6 max-w-[1280px] mx-auto py-12 gap-8">
    <div class="text-center max-w-2xl">
        <span class="text-primary font-bold text-sm uppercase tracking-wider">Surplus Redistribution</span>
        <h1 class="text-4xl font-bold text-on-surface dark:text-white mt-2 mb-4">Post a Food Donation</h1>
        <p class="text-on-surface-variant dark:text-gray-300">Fill out the details below to list your surplus food. Our automated matching system will notify nearby vetted organizations instantly.</p>
    </div>

    <div class="w-full max-w-xl bg-surface-container-lowest dark:bg-[#1e1e1e] rounded-xl p-6 md:p-8 shadow-sm border border-outline-variant dark:border-gray-800">
        <form id="donate-form" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-semibold text-on-surface dark:text-gray-300 mb-1">Business / Donor Name</label>
                <input class="w-full rounded-lg border border-outline-variant dark:border-gray-700 bg-surface-container-lowest dark:bg-[#2a2a2a] dark:text-white p-3 focus:border-primary focus:ring-2 focus:ring-primary/20" id="donor-name" placeholder="e.g., Grand Hotel Bistro" type="text" required>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-on-surface dark:text-gray-300 mb-1">Contact Email</label>
                    <input class="w-full rounded-lg border border-outline-variant dark:border-gray-700 bg-surface-container-lowest dark:bg-[#2a2a2a] dark:text-white p-3 focus:border-primary focus:ring-2 focus:ring-primary/20" id="donor-email" placeholder="name@example.com" type="email" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-on-surface dark:text-gray-300 mb-1">Phone Number</label>
                    <input class="w-full rounded-lg border border-outline-variant dark:border-gray-700 bg-surface-container-lowest dark:bg-[#2a2a2a] dark:text-white p-3 focus:border-primary focus:ring-2 focus:ring-primary/20" id="donor-phone" placeholder="7395886070" type="tel" required>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-on-surface dark:text-gray-300 mb-1">Food Category</label>
                    <select class="w-full rounded-lg border border-outline-variant dark:border-gray-700 bg-surface-container-lowest dark:bg-[#2a2a2a] dark:text-white p-3 focus:border-primary focus:ring-2 focus:ring-primary/20" id="food-category">
                        <option>Prepared Meals</option>
                        <option>Fresh Produce & Vegetables</option>
                        <option>Bakery & Pastries</option>
                        <option>Packaged / Canned Goods</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-on-surface dark:text-gray-300 mb-1">Approximate Quantity</label>
                    <input class="w-full rounded-lg border border-outline-variant dark:border-gray-700 bg-surface-container-lowest dark:bg-[#2a2a2a] dark:text-white p-3 focus:border-primary focus:ring-2 focus:ring-primary/20" id="food-qty" placeholder="e.g., 25 meals / 10kg" type="text" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-on-surface dark:text-gray-300 mb-1">Pickup Address / Notes</label>
                <textarea class="w-full rounded-lg border border-outline-variant dark:border-gray-700 bg-surface-container-lowest dark:bg-[#2a2a2a] dark:text-white p-3 focus:border-primary focus:ring-2 focus:ring-primary/20 resize-y" id="donor-notes" placeholder="Enter pickup address and available pickup window..." rows="3" required></textarea>
            </div>
            <button class="mt-2 bg-primary hover:opacity-90 text-on-primary font-semibold py-3 px-6 rounded-lg transition-all shadow-sm" type="submit">
                Submit Donation Listing
            </button>
        </form>
    </div>
</main>

<footer class="w-full py-8 bg-surface-container-high dark:bg-[#161616] flex justify-between items-center px-6 mt-auto">
    <span class="text-sm font-bold text-primary">FoodBridge</span>
    <span class="text-sm text-on-surface-variant dark:text-gray-400">© 2026 FoodBridge. All rights reserved.</span>
</footer>

<script>
    document.getElementById('donate-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const donor_name = document.getElementById('donor-name').value;
        const email = document.getElementById('donor-email').value;
        const phone = document.getElementById('donor-phone').value;
        const category = document.getElementById('food-category').value;
        const quantity = document.getElementById('food-qty').value;
        const notes = document.getElementById('donor-notes').value;

        try {
            const response = await fetch('http://localhost:3000/api/donate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ donor_name, email, phone, category, quantity, notes })
            });
            const result = await response.json();
            if (response.ok) {
                alert('Donation successfully posted, saved to database, and confirmation emails sent!');
                document.getElementById('donate-form').reset();
            } else {
                alert('Error: ' + (result.error || 'Failed to submit donation'));
            }
        } catch (err) {
            console.error(err);
            alert('Could not connect to backend server. Make sure "node server.js" is running!');
        }
    });

    // Session & Dark Mode Handler
    document.addEventListener("DOMContentLoaded", function() {
        const loggedInUser = localStorage.getItem('foodbridge_user');
        const navAuthButtons = document.getElementById('nav-auth-buttons');
        if (loggedInUser && navAuthButtons) {
            navAuthButtons.innerHTML = `
                <span class="text-sm text-on-surface-variant dark:text-gray-300">Hello, ${loggedInUser}</span>
                <button onclick="localStorage.removeItem('foodbridge_user'); window.location.reload();" class="bg-surface-container-high dark:bg-gray-800 text-on-surface dark:text-white px-3 py-1.5 rounded-lg text-sm">Log Out</button>
            `;
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = 'light_mode';
        }
    });

    function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        const icon = document.getElementById('theme-icon');
        if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
    }
</script>
</body>
</html>
